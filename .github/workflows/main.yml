name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          f=$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep . | head -n1)
          echo "Using: $f"
          unzip -q -o "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: CamOverlay
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CamOverlay-debug-apk
          path: CamOverlay/app/build/outputs/apk/debug/app-debug.apk
